name: Capacitor Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "resources/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.js"
      - ".github/workflows/android-capacitor.yml"
  push:
    branches: [main, feature/capacitor-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Validate public Supabase configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Set GitHub Actions secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY for an APK connected to Supabase. The build will continue, but the app will not be configured for login."
          fi

      - name: Build web application
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        run: npx cap add android

      - name: Generate launcher icons from provided brand icon
        run: npm run android:icons

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-flow-capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
