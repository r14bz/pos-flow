name: Capacitor Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "resources/**"
      - "index.html"
      - "package.json"
      - "supabase/migrations/**"
      - "capacitor.config.ts"
      - "vite.config.js"
      - ".github/workflows/android-capacitor.yml"
  push:
    branches: [main, feature/capacitor-android, fix/capacitor-camera-receipt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Validate public Supabase configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Set GitHub Actions secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY for an APK connected to Supabase. The build will continue, but the app will not be configured for login."
          fi

      - name: Build web application
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        run: npx cap add android

      - name: Create audible SEMAR notification channel
        run: |
          mkdir -p android/app/src/main/java/id/posflow/app
          cat > android/app/src/main/java/id/posflow/app/MainActivity.java <<'JAVA'
          package id.posflow.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      String channelId = "semar-alerts-v1";
                      NotificationChannel channel = new NotificationChannel(
                          channelId,
                          "Notifikasi SEMAR",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Peringatan stok menipis dan pembaruan toko");
                      channel.enableVibration(true);
                      channel.setSound(
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION),
                          new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }
          }
          JAVA

      - name: Configure Firebase Cloud Messaging (optional)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Firebase config secret is not set. The APK can build, but Android push registration will not work until FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is configured."
            exit 0
          fi
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Declare Android camera and Bluetooth permissions
        run: |
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
      - name: Generate launcher icons from provided brand icon
        run: npm run android:icons

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: semar-capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate release-signing secrets
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}. See the SEMAR signed release setup instructions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Configure release signing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/semar-release.jks
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../semar-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cd android && ./gradlew assembleRelease

      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: semar-android-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
